<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trendyol Delivery Run</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #333;
            overflow: hidden; /* Prevent scrolling */
            font-family: sans-serif;
            touch-action: none; /* Prevent browser handling of touch gestures */
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background-color: #e0e0e0;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 100%;
            max-height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        #score-board {
            padding: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #end-card {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: none; /* Hidden by default */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            pointer-events: auto;
            z-index: 10;
        }
        #end-card h1 {
            margin-bottom: 20px;
            color: #F27A1A; /* Trendyol Orange */
            font-size: 32px;
            text-align: center;
        }
        .cta-button {
            background-color: #F27A1A;
            color: white;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(242, 122, 26, 0.4);
            transition: transform 0.2s;
        }
        .cta-button:hover {
            transform: scale(1.05);
        }
        .retry-button {
            margin-top: 20px;
            background: transparent;
            border: 2px solid white;
            color: white;
            padding: 10px 30px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
        }
        #logo {
            position: absolute;
            bottom: 20px;
            color: #F27A1A;
            font-weight: 900;
            font-size: 24px;
            background: white;
            padding: 5px 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer">
        <div id="score-board">Skor: <span id="score">0</span></div>
    </div>
    <div id="end-card">
        <h1 id="end-message">Teslimat Başarılı!</h1>
        <a href="https://www.trendyol.com" target="_blank" class="cta-button">Trendyol'da Keşfet</a>
        <button class="retry-button" id="retry-btn">Tekrar Dene</button>
        <div id="logo">trendyol</div>
    </div>
</div>

<script src="game.js"></script>
</body>
</html>
